name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Build fat JAR
        run: mvn clean package -DskipTests

  integration-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      - name: Download and start Kafka
        run: |
          wget -q https://archive.apache.org/dist/kafka/4.2.0/kafka_2.13-4.2.0.tgz
          tar -xzf kafka_2.13-4.2.0.tgz
          mv kafka_2.13-4.2.0 kafka

          KAFKA_UUID=$(kafka/bin/kafka-storage.sh random-uuid)
          kafka/bin/kafka-storage.sh format -t $KAFKA_UUID \
            -c kafka/config/server.properties --standalone
          kafka/bin/kafka-server-start.sh \
            kafka/config/server.properties > /tmp/kafka.log 2>&1 &

          echo "Waiting for Kafka to be ready..."
          sleep 15

          kafka/bin/kafka-topics.sh --create \
            --bootstrap-server localhost:9092 \
            --topic open-notify-iss \
            --partitions 2 \
            --replication-factor 1

      - name: Run integration tests
        run: mvn test -Pintegration